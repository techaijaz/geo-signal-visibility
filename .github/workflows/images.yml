name: Images

# Builds the backend, frontend and website Docker images. On main they are pushed to
# GitHub Container Registry (ghcr.io), tagged with the commit SHA, so the server only has to pull them.
# On pull requests they are built but not pushed, to catch a broken Dockerfile before merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  # The frontend and website bake their URLs in at build time. Set the PROD_DOMAIN and
  # STRIPE_PUBLISHABLE_KEY repository variables (Settings > Secrets and variables > Actions > Variables)
  DOMAIN: ${{ vars.PROD_DOMAIN || 'geosignalai.com' }}

jobs:
  image:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, website]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args
        id: args
        run: |
          {
            echo 'list<<EOF'
            case "${{ matrix.service }}" in
              frontend)
                echo "VITE_API_BASE_URL=/api/v1"
                echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}"
                echo "VITE_SITE_URL=https://${DOMAIN}"
                ;;
              website)
                echo "SITE_URL=https://${DOMAIN}"
                echo "PUBLIC_APP_URL=https://app.${DOMAIN}"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ steps.args.outputs.list }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/signal-ai-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/signal-ai-${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
