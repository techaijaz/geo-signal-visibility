name: Deploy

# Deploys a commit of main to staging or production (Actions > Deploy > Run workflow).
# Both run on the same server: production in /opt/signal-ai, staging in /opt/signal-ai-staging.
# The images must already be on ghcr.io, so wait for the Images workflow of that commit to finish.
# Needs the DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS repository secrets. The user is not a
# secret (GitHub would mask the word "deploy" everywhere in the logs); DEPLOY_USER variable, default deploy.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      sha:
        description: Full commit SHA to deploy (empty = latest main)
        required: false
        default: ''

# One deploy at a time per environment; a second one waits instead of cancelling the first halfway
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && 'https://app.staging.geosignalai.com' || 'https://app.geosignalai.com' }}
    env:
      APP_DIR: ${{ inputs.environment == 'staging' && '/opt/signal-ai-staging' || '/opt/signal-ai' }}
      # Staging's frontend and website are built for the staging domains
      VARIANT: ${{ inputs.environment == 'staging' && '-staging' || '' }}
    steps:
      - name: Pick the commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Use the full 40-character commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check the images exist
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in backend "frontend$VARIANT" "website$VARIANT"; do
            if ! docker buildx imagetools inspect "ghcr.io/$OWNER/signal-ai-$image:$SHA" > /dev/null; then
              echo "::error::No $image image for $SHA yet. Wait for the Images workflow of this commit to finish."
              exit 1
            fi
          done

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$TARGET" \
            "cd $APP_DIR && git fetch -q origin && APP_DIR=$APP_DIR bash <(git show $SHA:deploy/deploy.sh) $SHA" < /dev/null
