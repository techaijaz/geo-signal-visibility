# Host nginx site for Signal AI staging, next to production on the same server.
# Copy to /etc/nginx/sites-available/signal-ai-staging.conf and follow DEPLOY.md ("Staging").
# certbot --nginx adds the HTTPS parts.
#
# Everything is handed to the staging Docker stack on 127.0.0.1:8090, which does the routing.
# A password keeps search engines and strangers out; the API is on the same domain, so the browser
# sends the same login with its API calls.

server {
    listen 80;
    listen [::]:80;
    server_name staging.geosignalai.com app.staging.geosignalai.com;

    client_max_body_size 10m;

    auth_basic "Signal AI staging";
    auth_basic_user_file /etc/nginx/signal-ai-staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't spoof their IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
