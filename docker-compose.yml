# Signal AI on a single VPS (Hostinger KVM 2 or bigger). See DEPLOY.md.
#
#   https://${DOMAIN}       marketing website
#   https://app.${DOMAIN}   React app + API (/api/v1)
#
# Reads secrets from ./.env (copy .env.docker.example). Compose refuses to start if a required
# variable (marked :?) is missing, instead of booting with broken auth or DB.
# Only nginx publishes ports (80/443); MongoDB and Redis are reachable inside the Docker network only.

x-backend: &backend
  env_file: .env
  environment:
    - NODE_ENV=production
    - PORT=8080
    - DATABASE_URL=mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-signal}?authSource=admin
    - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
    - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    - FRONTEND_URL=https://app.${DOMAIN:?Set DOMAIN in .env}
    - SERVER_URL=https://app.${DOMAIN}
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Cap MongoDB's cache so it leaves room for the app on a small VPS
    command: ['--wiredTigerCacheSizeGB', '1']
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    logging: *logging

  # BullMQ broker. noeviction: BullMQ must never have its keys evicted
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m
    logging: *logging

  # Express API (stateless; `docker compose up -d --scale api=2` on a bigger VPS)
  api:
    <<: *backend
    command: npm run start:api
    mem_limit: 1536m

  # BullMQ workers: scans, audits, recommendations, scheduler, plan expiry
  worker:
    <<: *backend
    command: npm run start:worker
    mem_limit: 1536m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  website:
    build:
      context: ./website
      args:
        SITE_URL: https://${DOMAIN}
        PUBLIC_APP_URL: https://app.${DOMAIN}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
      - website
    mem_limit: 128m
    logging: *logging

  # Let's Encrypt. Not started by `up`; used by deploy/init-ssl.sh and deploy/renew-ssl.sh
  certbot:
    image: certbot/certbot
    profiles: ['tools']
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

volumes:
  mongo_data:
  redis_data:
