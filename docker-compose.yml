version: '3.8'

# Reads secrets and keys from ./.env (copy .env.docker.example). Compose refuses to start
# if a required variable (marked with :?) is missing, instead of booting with broken auth/DB.

x-backend-env: &backend-env
  env_file: .env
  environment:
    - NODE_ENV=production
    - PORT=8080
    - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL (MongoDB connection string) in .env}
    - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
    - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

services:
  # 1. Redis Queue Broker for BullMQ (internal network only, password protected)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - geo_network

  # 2. Backend Express API (stateless; scale with `docker compose up --scale api=3`)
  api:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: npm run start:api
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - geo_network

  # 3. Backend BullMQ Worker Pool (Scans, Audits, Recommendations, Scheduler)
  worker:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: npm run start:worker
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - geo_network

  # 4. Frontend React SPA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - geo_network

  # 5. Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - geo_network

volumes:
  redis_data:

networks:
  geo_network:
    driver: bridge
