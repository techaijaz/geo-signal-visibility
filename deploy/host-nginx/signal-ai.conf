# Host nginx site for Signal AI when the server already runs other sites (shared-server mode).
# Copy to /etc/nginx/sites-available/signal-ai.conf, replace geosignalai.com if your domain differs,
# then follow DEPLOY.md ("Sharing the server with another site"). certbot --nginx adds the HTTPS parts.
#
# Everything is handed to the Signal AI Docker stack on 127.0.0.1:8088, which does the routing.

server {
    listen 80;
    listen [::]:80;
    server_name geosignalai.com www.geosignalai.com app.geosignalai.com status.geosignalai.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't spoof their IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uptime Kuma's dashboard uses WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_signal;
        proxy_read_timeout 120s;
    }
}

# "upgrade" only when the browser asks for a WebSocket
map $http_upgrade $connection_upgrade_signal {
    default upgrade;
    ''      close;
}
