version: '3.8'

services:
  # 1. Redis Queue Broker for BullMQ
  redis:
    image: redis:7-alpine
    container_name: geo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geo_network

  # 2. Backend Express API Instances (Stateless)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo_backend_api
    restart: always
    command: npm run start:api
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/geo-db}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - redis
    networks:
      - geo_network

  # 3. Backend BullMQ Worker Pool (Scans, Audits, Recommendations, Scheduler)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo_backend_worker
    restart: always
    command: npm run start:worker
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/geo-db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - redis
    networks:
      - geo_network

  # 4. Frontend React SPA Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geo_frontend
    restart: always
    networks:
      - geo_network

  # 5. Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: geo_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - geo_network

volumes:
  redis_data:

networks:
  geo_network:
    driver: bridge
