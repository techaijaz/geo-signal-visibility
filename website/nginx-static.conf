# Serves the built Astro site: /pricing -> /pricing/index.html, unknown paths -> 404.html
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects (/pricing -> /pricing/) so they keep the visitor's https host behind the proxies
    absolute_redirect off;
    error_page 404 /404.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
