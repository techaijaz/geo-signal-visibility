# Signal AI on a single VPS (Hostinger KVM 2 or bigger). See DEPLOY.md.
#
#   https://${DOMAIN}       marketing website
#   https://app.${DOMAIN}   React app + API (/api/v1)
#   https://status.${DOMAIN} Uptime Kuma (uptime monitoring and alerts)
#
# Reads secrets from ./.env (copy .env.docker.example). Compose refuses to start if a required
# variable (marked :?) is missing, instead of booting with broken auth or DB.
# Only nginx publishes ports; MongoDB and Redis are reachable inside the Docker network only.
#
# Two ways to run (set in .env, see DEPLOY.md):
#   Own server      nginx takes ports 80/443 and handles HTTPS itself (defaults below)
#   Shared server   another site already uses 80/443 through the server's nginx: set
#                   NGINX_HTTP_BIND=127.0.0.1:8088, NGINX_HTTPS_BIND=127.0.0.1:8443 and
#                   NGINX_TEMPLATES=./nginx/templates-behind-proxy, and let the host nginx proxy to it
#
# Images: api, worker, frontend and website run the images GitHub Actions pushes to ghcr.io.
# IMAGE_TAG (a commit SHA, written to .env by deploy/deploy.sh) picks the version. The frontend and
# website bake their URLs in at build time, so staging runs its own builds (IMAGE_VARIANT=-staging).
# `build:` stays so `docker compose build` still works on a machine without access to the registry.

x-backend: &backend
  env_file: .env
  environment:
    - NODE_ENV=production
    - PORT=8080
    - DATABASE_URL=mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/${MONGO_DB:-signal}?authSource=admin
    - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
    - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    - FRONTEND_URL=https://app.${DOMAIN:?Set DOMAIN in .env}
    - SERVER_URL=https://app.${DOMAIN}
    - WEBSITE_URL=https://${DOMAIN}
    - WORKER_HEALTH_PORT=8081
  image: ${IMAGE_REGISTRY:-ghcr.io/techaijaz}/signal-ai-backend:${IMAGE_TAG:-main}
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  # autoheal restarts containers with this label when their healthcheck keeps failing
  labels:
    autoheal: 'true'
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Cap MongoDB's cache so it leaves room for the app on a small VPS
    command: ['--wiredTigerCacheSizeGB', '${MONGO_CACHE_GB:-1}']
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${MONGO_MEM_LIMIT:-2g}
    logging: *logging

  # BullMQ broker. noeviction: BullMQ must never have its keys evicted
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m
    logging: *logging

  # Express API (stateless; `docker compose up -d --scale api=2` on a bigger VPS)
  api:
    <<: *backend
    command: npm run start:api
    # Liveness: /healthz answers while the process is alive. /readyz (Mongo + Redis) is for Kubernetes readiness
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: ${API_MEM_LIMIT:-1536m}

  # BullMQ workers: scans, audits, recommendations, scheduler, plan expiry
  worker:
    <<: *backend
    command: npm run start:worker
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: ${WORKER_MEM_LIMIT:-1536m}

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/techaijaz}/signal-ai-frontend${IMAGE_VARIANT:-}:${IMAGE_TAG:-main}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  website:
    image: ${IMAGE_REGISTRY:-ghcr.io/techaijaz}/signal-ai-website${IMAGE_VARIANT:-}:${IMAGE_TAG:-main}
    build:
      context: ./website
      args:
        SITE_URL: https://${DOMAIN}
        PUBLIC_APP_URL: https://app.${DOMAIN}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_BIND:-80}:80'
      - '${NGINX_HTTPS_BIND:-443}:443'
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ${NGINX_TEMPLATES:-./nginx/templates}:/etc/nginx/templates:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      website:
        condition: service_started
      # Not required: staging runs without Uptime Kuma (docker-compose.staging.yml)
      uptime-kuma:
        condition: service_started
        required: false
    mem_limit: 128m
    logging: *logging

  # Restarts api/worker when their healthcheck keeps failing (Compose itself only restarts on exit).
  # Needs the Docker socket; on Kubernetes liveness probes do this job instead
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    logging: *logging

  # Uptime monitoring with alerts (email, Telegram, webhooks...). Set up at https://status.${DOMAIN}
  uptime-kuma:
    # Major-version tag: gets v2 bug and security fixes (v1 is no longer maintained)
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    mem_limit: 384m
    logging: *logging

  # Let's Encrypt. Not started by `up`; used by deploy/init-ssl.sh and deploy/renew-ssl.sh
  certbot:
    image: certbot/certbot
    profiles: ['tools']
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

volumes:
  mongo_data:
  redis_data:
  uptime_kuma_data:
