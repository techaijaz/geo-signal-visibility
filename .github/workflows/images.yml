name: Images

# Builds the backend, frontend and website Docker images. On main they are pushed to
# GitHub Container Registry (ghcr.io), tagged with the commit SHA, so the server only has to pull them.
# On pull requests they are built but not pushed, to catch a broken Dockerfile before merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

# The frontend and website bake their URLs in at build time, so they are built once per environment:
# signal-ai-frontend for production, signal-ai-frontend-staging for staging. The backend reads its
# URLs at runtime and is one image for both. Domains come from the PROD_DOMAIN and STAGING_DOMAIN
# repository variables (Settings > Secrets and variables > Actions > Variables), with these defaults.

jobs:
  image:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, image: backend, env: production }
          - { service: frontend, image: frontend, env: production }
          - { service: website, image: website, env: production }
          - { service: frontend, image: frontend-staging, env: staging }
          - { service: website, image: website-staging, env: staging }
    env:
      DOMAIN: ${{ matrix.env == 'staging' && (vars.STAGING_DOMAIN || 'staging.geosignalai.com') || (vars.PROD_DOMAIN || 'geosignalai.com') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # Docker Hub rate-limits and fails anonymous pulls from shared runners
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args
        id: args
        run: |
          {
            echo 'list<<EOF'
            case "${{ matrix.service }}" in
              frontend)
                echo "VITE_API_BASE_URL=/api/v1"
                echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ vars[matrix.env == 'staging' && 'STAGING_STRIPE_PUBLISHABLE_KEY' || 'STRIPE_PUBLISHABLE_KEY'] }}"
                echo "VITE_SITE_URL=https://${DOMAIN}"
                ;;
              website)
                echo "SITE_URL=https://${DOMAIN}"
                echo "PUBLIC_APP_URL=https://app.${DOMAIN}"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ steps.args.outputs.list }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/signal-ai-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/signal-ai-${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
