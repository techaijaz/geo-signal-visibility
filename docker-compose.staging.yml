# Staging overrides, on the same server as production. Staging's .env loads it with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.staging.yml
# See DEPLOY.md ("Staging"). Production does not use this file.

services:
  # Production's autoheal already watches every container labelled autoheal=true on this server,
  # staging's api and worker included, and production's Uptime Kuma can monitor staging too
  autoheal:
    profiles: [production-only]
  uptime-kuma:
    profiles: [production-only]

  # Staging mail never leaves the server: every email lands here. Point staging's SMTP_* at
  # mailpit:1025 (any user/pass); read mail at http://127.0.0.1:8025 on the server (web UI and API)
  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 2000
    ports:
      - '127.0.0.1:8025:8025'
